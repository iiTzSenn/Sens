name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: win32-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
          - platform: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.platform == 'linux-arm64'
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path rust/sens-hook/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Assemble the platform package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.platform }}" == win32-* ]] && ext=".exe"
          node scripts/package-native.mjs ${{ matrix.platform }} \
            "rust/sens-hook/target/${{ matrix.target }}/release/sens-hook$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: npm/${{ matrix.platform }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path rust/sens-hook/Cargo.toml
      - name: Hook differential
        run: |
          cargo build --release --manifest-path rust/sens-hook/Cargo.toml
          node dist/cli.js index
          node rust/diff-hook.mjs | tee /dev/stderr | grep -q "distintos: 0"

  installer:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Import the signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            throw "falta el secreto WINDOWS_CERTIFICATE: sin certificado no hay instalador firmado"
          }
          $pfx = Join-Path $env:RUNNER_TEMP "sens.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          "SENS_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
      - run: node scripts/app-installer.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: sens-installer
          path: |
            rust/sens-setup/target/installer/*.exe
            rust/sens-setup/target/installer/*.exe.sig
      - name: Attach it to the release, if there is one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" rust/sens-setup/target/installer/*.exe rust/sens-setup/target/installer/*.exe.sig --clobber
          else
            echo "no hay release para $tag; el instalador queda como artefacto del workflow"
          fi

  publish:
    needs: [build-native, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm
      - run: npm ci
      - run: npm run build
      - name: Point the manifest at the platform packages
        run: node scripts/package-native.mjs --manifest-only
      - name: Publish the platform packages
        run: |
          for dir in npm/npm-*; do
            npm publish "$dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sens-mcp
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
