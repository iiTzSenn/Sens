name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win32-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: win32-arm64
            runner: windows-latest
            target: aarch64-pc-windows-msvc
          - platform: darwin-x64
            runner: macos-latest
            target: x86_64-apple-darwin
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
          - platform: linux-x64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - platform: linux-arm64
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/setup-cross-toolchain-action@v1
        if: matrix.platform == 'linux-arm64'
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path rust/sens-hook/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Assemble the platform package
        shell: bash
        run: |
          ext=""
          [[ "${{ matrix.platform }}" == win32-* ]] && ext=".exe"
          node scripts/package-native.mjs ${{ matrix.platform }} \
            "rust/sens-hook/target/${{ matrix.target }}/release/sens-hook$ext"
      - uses: actions/upload-artifact@v4
        with:
          name: npm-${{ matrix.platform }}
          path: npm/${{ matrix.platform }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path rust/sens-hook/Cargo.toml
      - name: Hook differential
        run: |
          cargo build --release --manifest-path rust/sens-hook/Cargo.toml
          node dist/cli.js index
          node rust/diff-hook.mjs | tee /dev/stderr | grep -q "distintos: 0"

  publish:
    needs: [build-native, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          pattern: npm-*
          path: npm
      - run: npm ci
      - run: npm run build
      - name: Point the manifest at the platform packages
        run: node scripts/package-native.mjs --manifest-only
      - name: Publish the platform packages
        run: |
          for dir in npm/npm-*; do
            npm publish "$dir" --access public --provenance
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish sens-mcp
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
