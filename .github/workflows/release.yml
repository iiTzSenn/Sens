name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag names the version it releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/version.ts "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm test

  installer:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The updater key is there
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "falta el secreto TAURI_SIGNING_PRIVATE_KEY: sin la firma de la actualización, las copias instaladas no verían esta versión"
          }
      - name: Import the signing certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          ALLOW_UNSIGNED: ${{ vars.SENS_ALLOW_UNSIGNED }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            $pfx = Join-Path $env:RUNNER_TEMP "sens.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            Remove-Item $pfx
            "SENS_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          } elseif ($env:ALLOW_UNSIGNED -eq "true") {
            "::warning::sin WINDOWS_CERTIFICATE, el instalador sale sin firmar: Windows mostrará el aviso de SmartScreen"
            "SENS_INSTALLER_FLAGS=--unsigned" >> $env:GITHUB_ENV
          } else {
            throw "falta el secreto WINDOWS_CERTIFICATE. Añádelo, o pon la variable SENS_ALLOW_UNSIGNED a true para publicar sin firmar a sabiendas"
          }
      - run: node scripts/app-installer.mjs ${{ env.SENS_INSTALLER_FLAGS }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: sens-installer
          path: |
            rust/sens-setup/target/installer/*.exe
            rust/sens-setup/target/installer/*.exe.sig
      - name: Attach it to the release, if there is one
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" rust/sens-setup/target/installer/*.exe rust/sens-setup/target/installer/*.exe.sig --clobber
          else
            echo "no hay release para $tag; el instalador queda como artefacto del workflow"
          fi
