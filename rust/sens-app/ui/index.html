<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sens</title>
<style>
  :root {
    --ground: #08090C;
    --panel: #0B0D11;
    --card: #101218;
    --raise: #161922;
    --hair: rgba(255, 255, 255, .07);
    --hair-strong: rgba(255, 255, 255, .16);
    --text: #ECEEF2;
    --dim: #9AA2B0;
    --faint: #626B7A;
    --ghost: #3A424F;
    --red: #FF5638;
    --red-wash: rgba(255, 86, 56, .1);
    --green: #21D98A;
    --green-wash: rgba(33, 217, 138, .1);
    --amber: #E8A93C;
    --blue: #3D4CFF;
    --blue-wash: rgba(61, 76, 255, .14);
    --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    --display: "Bahnschrift", "Segoe UI Variable Display", "Arial Narrow", sans-serif;
    --mono: "Cascadia Mono", "Cascadia Code", Consolas, ui-monospace, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--ground); color: var(--text);
    font-family: var(--ui); font-size: 14px; line-height: 1.6;
    overflow: hidden; user-select: none;
    -webkit-font-smoothing: antialiased;
  }

  button, input, select { font: inherit; color: inherit; }
  button { background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--blue); outline-offset: 1px; }

  .label {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--ghost);
  }

  .app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr); }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 12px; overflow: hidden;
    border-bottom: 1px solid var(--hair); background: var(--panel);
    -webkit-app-region: drag;
  }
  .topbar button, .topbar input, .topbar select { -webkit-app-region: no-drag; }

  .brand { display: flex; align-items: center; gap: 8px; flex: none; }
  .brand b {
    font-family: var(--display); font-variation-settings: "wght" 600, "wdth" 75;
    font-size: 17px; letter-spacing: .1em; text-transform: uppercase;
  }

  .chipbtn {
    display: flex; align-items: center; gap: 7px; min-width: 0; flex: 0 1 auto;
    padding: 5px 9px; border: 1px solid var(--hair);
    font-family: var(--mono); font-size: 11px; color: var(--dim);
    background: var(--card); transition: border-color .12s, color .12s;
  }
  .chipbtn:hover { border-color: var(--hair-strong); color: var(--text); }
  .chipbtn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .field {
    width: 130px; min-width: 0; background: var(--card); border: 1px solid var(--hair);
    padding: 5px 9px; font-family: var(--mono); font-size: 11px;
    outline: none; user-select: text;
  }
  .field:focus { border-color: var(--blue); }
  .field::placeholder { color: var(--ghost); }
  .field:disabled { opacity: .35; }
  .field[hidden] { display: none; }

  select.field { width: auto; max-width: 190px; color: var(--dim); }

  .health {
    margin-left: auto; display: flex; align-items: center; gap: 12px; flex: none;
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap;
  }
  .health .pip { width: 6px; height: 6px; background: var(--ghost); display: inline-block; margin-right: 6px; }
  .health[data-fresh="true"] .pip { background: var(--green); }
  .health[data-fresh="false"] .pip { background: var(--amber); }
  .health b { color: var(--dim); font-weight: 400; }
  .health .seal { color: var(--ghost); }

  .body {
    display: grid; grid-template-columns: 210px minmax(0, 1fr) 0;
    min-height: 0; transition: grid-template-columns .16s;
  }
  .body[data-code="open"] { grid-template-columns: 210px minmax(0, 1fr) minmax(380px, 46%); }

  .rail { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--panel); border-right: 1px solid var(--hair); }
  .rail-head { padding: 16px 14px 9px; display: flex; align-items: center; gap: 10px; }
  .icon-btn {
    width: 22px; height: 22px; display: grid; place-items: center;
    color: var(--faint); border: 1px solid var(--hair); transition: color .12s, border-color .12s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--hair-strong); }
  .icon-btn[aria-pressed="true"] { color: var(--blue); border-color: var(--blue); }
  .rail-head .icon-btn { margin-left: auto; }

  .sessions { overflow: auto; min-height: 0; padding: 0 6px 12px; display: flex; flex-direction: column; }
  .session { text-align: left; padding: 8px 8px; display: grid; gap: 2px; border-left: 2px solid transparent; }
  .session:hover { background: var(--card); }
  .session[aria-current="true"] { background: var(--card); border-left-color: var(--blue); }
  .session .name { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session[aria-current="true"] .name { color: var(--text); }
  .session .meta { font-family: var(--mono); font-size: 10px; color: var(--ghost); display: flex; gap: 8px; }
  .session .meta .cut { color: var(--green); }
  .session .meta .hit { color: var(--red); }
  .none { padding: 12px 8px; font-family: var(--mono); font-size: 11px; color: var(--ghost); }

  .chat { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; min-width: 0; }
  .thread { overflow: auto; min-height: 0; }
  .thread-inner { max-width: 760px; margin: 0 auto; padding: 26px 24px 8px; display: flex; flex-direction: column; gap: 18px; }

  .turn { display: grid; gap: 6px; }
  .turn .who {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--ghost);
  }
  .turn .body-text { color: var(--dim); }
  .turn.you { border-left: 2px solid var(--blue); padding-left: 13px; }
  .turn.you .who { color: var(--blue); }
  .turn.you .body-text { color: var(--text); }

  .tick {
    display: flex; align-items: baseline; gap: 9px;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
  }
  .tick .dot { width: 4px; height: 4px; background: var(--ghost); flex: none; transform: translateY(-2px); }
  .tick b { color: var(--dim); font-weight: 400; }
  .tick.warn { color: var(--amber); }
  .tick.warn .dot { background: var(--amber); }

  .card { border: 1px solid var(--hair); background: var(--card); overflow: hidden; }

  .verdict { border-left: 2px solid var(--sig, var(--ghost)); }
  .verdict[data-v="stop"] { --sig: var(--red); }
  .verdict[data-v="clear"] { --sig: var(--green); }
  .verdict .top { padding: 13px 15px 11px; }
  .verdict .kicker {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--sig); margin-bottom: 7px;
  }
  .verdict .said {
    font-family: var(--display); font-variation-settings: "wght" 350, "wdth" 75;
    font-size: 27px; line-height: 1.05; letter-spacing: .005em; text-transform: uppercase;
  }
  .verdict .gates { display: flex; gap: 4px; flex-wrap: wrap; padding: 0 15px 12px; }
  .gate {
    font-family: var(--mono); font-size: 10px; padding: 3px 7px;
    border: 1px solid var(--hair); color: var(--faint);
    text-transform: uppercase; letter-spacing: .06em;
  }
  .gate[data-v="stop"] { color: var(--red); border-color: var(--red); background: var(--red-wash); }
  .gate[data-v="pass"] { color: var(--green); border-color: rgba(33, 217, 138, .32); }
  .gate[data-v="abstain"] { color: var(--amber); border-color: rgba(232, 169, 60, .35); }
  .verdict .proof {
    border-top: 1px solid var(--hair); padding: 10px 15px;
    font-family: var(--mono); font-size: 11px; color: var(--faint);
    display: grid; gap: 4px; user-select: text;
  }
  .verdict .proof div { overflow-wrap: anywhere; }

  .diff .top {
    display: flex; align-items: center; gap: 10px; padding: 10px 13px;
    border-bottom: 1px solid var(--hair);
    font-family: var(--mono); font-size: 11.5px; color: var(--dim);
  }
  .diff .top .file { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .diff .top .tally { margin-left: auto; display: flex; gap: 8px; flex: none; }
  .diff .top .plus { color: var(--green); }
  .diff .top .minus { color: var(--red); }
  .diff .lines { overflow-x: auto; padding: 6px 0; user-select: text; }
  .diff .row { display: flex; font-family: var(--mono); font-size: 12px; line-height: 1.75; white-space: pre; }
  .diff .row .num { width: 44px; flex: none; text-align: right; padding-right: 11px; color: var(--ghost); user-select: none; }
  .diff .row .mark { width: 15px; flex: none; user-select: none; }
  .diff .row .src { padding-right: 16px; }
  .diff .row.add { background: var(--green-wash); }
  .diff .row.add .mark { color: var(--green); }
  .diff .row.del { background: var(--red-wash); }
  .diff .row.del .mark { color: var(--red); }
  .diff .row.del .src { color: var(--dim); }
  .diff .more {
    width: 100%; text-align: left; padding: 8px 13px; border-top: 1px solid var(--hair);
    font-family: var(--mono); font-size: 11px; color: var(--faint);
  }
  .diff .more:hover { color: var(--text); background: var(--raise); }

  .composer { padding: 12px 24px 18px; }
  .composer-inner { max-width: 760px; margin: 0 auto; }
  .composer .box {
    display: flex; align-items: center; gap: 10px;
    border: 1px solid var(--hair-strong); background: var(--card); padding: 11px 14px;
    transition: border-color .12s;
  }
  .composer .box:focus-within { border-color: var(--blue); }
  .composer .caret { font-family: var(--mono); color: var(--blue); flex: none; }
  .composer input {
    flex: 1; min-width: 0; border: 0; background: none; outline: none;
    font-size: 14px; user-select: text;
  }
  .composer input::placeholder { color: var(--ghost); }
  .composer input:disabled { color: var(--faint); }
  .composer .under {
    margin-top: 8px; display: flex; justify-content: space-between; gap: 12px;
    font-family: var(--mono); font-size: 10px; color: var(--ghost);
    text-transform: uppercase; letter-spacing: .08em;
  }
  .composer .under span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .composer .under .saved { color: var(--green); }

  .code {
    background: var(--panel); border-left: 1px solid var(--hair);
    display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden;
  }
  .code-head {
    display: flex; align-items: center; gap: 10px; padding: 0 12px;
    height: 38px; border-bottom: 1px solid var(--hair);
  }
  .code-head .icon-btn { margin-left: auto; }
  .code-head .where {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left;
  }
  .code-head .marks { font-family: var(--mono); font-size: 10.5px; display: flex; gap: 7px; flex: none; }
  .code-head .marks .plus { color: var(--green); }
  .code-head .marks .minus { color: var(--red); }

  .code-body { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 0; }
  .code-body[data-tree="hidden"] { grid-template-columns: 0 minmax(0, 1fr); }

  .tree { border-right: 1px solid var(--hair); display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; overflow: hidden; }
  .tree .filter { padding: 8px; }
  .tree .filter input { width: 100%; }
  .filelist { overflow: auto; min-height: 0; padding: 0 0 12px; display: flex; flex-direction: column; }
  .filerow {
    text-align: left; padding: 5px 8px; border-left: 2px solid transparent;
    display: flex; align-items: baseline; gap: 8px;
    font-family: var(--mono); font-size: 11px; color: var(--dim);
  }
  .filerow:hover { background: var(--card); color: var(--text); }
  .filerow[aria-current="true"] { background: var(--card); color: var(--text); border-left-color: var(--blue); }
  .filerow .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; direction: rtl; text-align: left; }
  .filerow .n { margin-left: auto; color: var(--ghost); flex: none; }
  .filerow[data-touched="true"] .n { color: var(--green); }

  .source { overflow: auto; min-height: 0; padding: 8px 0 24px; user-select: text; }
  .source .line { display: flex; font-family: var(--mono); font-size: 12px; line-height: 1.7; white-space: pre; }
  .source .line .num {
    width: 48px; flex: none; text-align: right; padding-right: 12px;
    color: var(--ghost); user-select: none; border-right: 1px solid transparent;
  }
  .source .line .src { padding: 0 16px 0 10px; min-width: 0; }
  .source .line[data-touched="add"] { background: var(--green-wash); }
  .source .line[data-touched="add"] .num { border-right-color: var(--green); color: var(--green); }
  .source .empty { padding: 14px 16px; font-family: var(--mono); font-size: 11px; color: var(--ghost); }

  .tok-key { color: #C08CFF; }
  .tok-str { color: #9AE68A; }
  .tok-num { color: #FFB86B; }
  .tok-com { color: var(--ghost); font-style: italic; }
  .tok-fn { color: #7FD4FF; }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <g fill="none" stroke="#7196FF" stroke-width="2.4" stroke-linecap="round" opacity=".45">
          <line x1="23" y1="23" x2="12" y2="14"/><line x1="23" y1="23" x2="36" y2="12"/>
          <line x1="23" y1="23" x2="37" y2="32"/><line x1="23" y1="23" x2="14" y2="36"/>
        </g>
        <g fill="#7196FF">
          <circle cx="23" cy="23" r="5.4"/><circle cx="12" cy="14" r="2.9"/>
          <circle cx="36" cy="12" r="3.6"/><circle cx="37" cy="32" r="3.2"/><circle cx="14" cy="36" r="2.7"/>
        </g>
      </svg>
      <b>Sens</b>
    </div>

    <button class="chipbtn" id="open">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 7.5h6l2 2.5h10V19H3z"/>
      </svg>
      <span id="root">Abrir proyecto…</span>
    </button>

    <select class="field" id="provider" title="Quién escribe">
      <option value="api">API Anthropic · por tokens</option>
      <option value="claude">Claude Code · tu suscripción</option>
      <option value="otro">Otro comando…</option>
    </select>
    <input class="field" id="command" placeholder="mi-cli --flag" autocomplete="off" spellcheck="false" hidden>
    <input class="field" id="key" type="password" placeholder="clave Anthropic" autocomplete="off" spellcheck="false">

    <div class="health" id="health" data-fresh="none">
      <span><span class="pip"></span><span id="index-state">sin índice</span></span>
      <span>sello <b id="seal">—</b></span>
      <button class="icon-btn" id="toggle-files" title="Ficheros del proyecto">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 4h9l5 5v11H5z"/><path d="M14 4v5h5"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="body" id="body" data-code="closed">
    <nav class="rail">
      <div class="rail-head">
        <span class="label">Sesiones</span>
        <button class="icon-btn" id="new-session" title="Sesión nueva">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
      </div>
      <div class="sessions" id="sessions"><p class="none">Abre un proyecto.</p></div>
    </nav>

    <section class="chat">
      <div class="thread" id="thread">
        <div class="thread-inner" id="thread-inner"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <div class="box">
            <span class="caret" aria-hidden="true">›</span>
            <input id="task" placeholder="Dime qué hacer…" autocomplete="off" disabled>
          </div>
          <div class="under">
            <span id="crew">sonnet 5 · haiku 4.5</span>
            <span class="saved" id="saved"></span>
          </div>
        </div>
      </div>
    </section>

    <aside class="code" id="code">
      <div class="code-head">
        <span class="where" id="where">Ningún fichero abierto</span>
        <span class="marks" id="marks"></span>
        <button class="icon-btn" id="toggle-tree" title="Árbol de ficheros" aria-pressed="true">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4 6h6M4 12h16M4 18h10"/>
          </svg>
        </button>
        <button class="icon-btn" id="close-code" title="Cerrar">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div class="code-body" id="code-body" data-tree="shown">
        <div class="tree">
          <div class="filter"><input class="field" id="filter" placeholder="filtrar…" autocomplete="off" spellcheck="false"></div>
          <div class="filelist" id="filelist"><p class="none">Sin proyecto.</p></div>
        </div>
        <div class="source" id="source"><p class="empty">Elige un fichero.</p></div>
      </div>
    </aside>
  </div>
</div>

<script>
  const invoke = window.__TAURI__.core.invoke;
  const listen = window.__TAURI__.event.listen;
  const dialog = window.__TAURI__.dialog;

  const DIFF_PREVIEW = 14;

  const body = document.getElementById("body");
  const thread = document.getElementById("thread");
  const inner = document.getElementById("thread-inner");
  const taskInput = document.getElementById("task");
  const keyInput = document.getElementById("key");
  const commandInput = document.getElementById("command");
  const providerSelect = document.getElementById("provider");
  const rootLabel = document.getElementById("root");
  const indexState = document.getElementById("index-state");
  const sealLabel = document.getElementById("seal");
  const health = document.getElementById("health");
  const sessionList = document.getElementById("sessions");
  const fileList = document.getElementById("filelist");
  const where = document.getElementById("where");
  const marks = document.getElementById("marks");
  const sourcePane = document.getElementById("source");
  const codeBody = document.getElementById("code-body");
  const filterInput = document.getElementById("filter");
  const crewLabel = document.getElementById("crew");
  const savedLabel = document.getElementById("saved");

  let root = "";
  let current = "";
  let saved = 0;
  let busy = false;
  let files = [];
  let opened = "";
  const touched = new Map();

  const el = (tag, className, value) => {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value !== undefined) node.textContent = value;
    return node;
  };

  const signed = (n) => `${n >= 0 ? "+" : ""}${n}`;

  function place(node) {
    inner.append(node);
    thread.scrollTop = thread.scrollHeight;
    return node;
  }

  function turn(who, value, mine) {
    const node = el("div", mine ? "turn you" : "turn");
    node.append(el("div", "who", who), el("div", "body-text", value));
    return place(node);
  }

  function tick(parts, tone) {
    const node = el("div", tone ? `tick ${tone}` : "tick");
    node.append(el("span", "dot"));
    const line = el("span");
    for (const part of [].concat(parts)) {
      line.append(typeof part === "string" ? document.createTextNode(part) : part);
    }
    node.append(line);
    return place(node);
  }

  const bold = (value) => el("b", null, value);

  function verdictCard(outcome) {
    const stopped = outcome.rulings.filter((r) => r.verdict === "stop");
    const card = el("div", "card verdict");
    card.dataset.v = outcome.applies ? "clear" : "stop";

    const top = el("div", "top");
    top.append(
      el("div", "kicker", outcome.applies
        ? `los ${outcome.rulings.length} gates pasan · ${signed(outcome.netLines)} líneas`
        : `${stopped[0].gate} · ${stopped[0].rule} · regla compilada`),
      el("div", "said", outcome.applies ? "Puedes escribirlo." : stopped[0].said),
    );
    card.append(top);

    const gates = el("div", "gates");
    for (const ruling of outcome.rulings) {
      const chip = el("span", "gate", `${ruling.gate} ${ruling.rule}`);
      chip.dataset.v = ruling.verdict;
      chip.title = ruling.said;
      gates.append(chip);
    }
    card.append(gates);

    const evidence = stopped.flatMap((r) => r.evidence);
    if (evidence.length) {
      const proof = el("div", "proof");
      for (const item of evidence) proof.append(el("div", null, item));
      card.append(proof);
    }
    return place(card);
  }

  function diffCard(file) {
    const card = el("div", "card diff");

    const top = el("div", "top");
    const tally = el("div", "tally");
    tally.append(
      el("span", "plus", `+${file.added.length}`),
      el("span", "minus", `−${file.removed.length}`),
    );
    top.append(el("span", "file", file.path), tally);
    card.append(top);

    const rows = [
      ...file.removed.map((line) => ({ line, kind: "del" })),
      ...file.added.map((line) => ({ line, kind: "add" })),
    ].sort((a, b) => a.line.line - b.line.line);

    const lines = el("div", "lines");
    const draw = (from, to) => {
      for (const { line, kind } of rows.slice(from, to)) {
        const row = el("div", `row ${kind}`);
        row.append(
          el("span", "num", String(line.line)),
          el("span", "mark", kind === "add" ? "+" : "−"),
          el("span", "src", line.text),
        );
        lines.append(row);
      }
    };

    draw(0, DIFF_PREVIEW);
    card.append(lines);

    if (rows.length > DIFF_PREVIEW) {
      const more = el("button", "more", `mostrar ${rows.length - DIFF_PREVIEW} líneas más`);
      more.addEventListener("click", () => {
        draw(DIFF_PREVIEW, rows.length);
        more.remove();
      });
      card.append(more);
    }
    return place(card);
  }

  function renderStep(step) {
    switch (step.step) {
      case "oriented":
        tick(["leí el mapa · ", bold(`${step.symbols} símbolos`), `, ${step.files} ficheros · ningún fichero abierto entero`]);
        break;
      case "proposed":
        tick([`${step.model} propone `, bold(step.paths.join(", ")), step.note ? ` · ${step.note}` : ""]);
        break;
      case "judged":
        verdictCard(step.outcome);
        break;
      case "proven": {
        const verdict = step.ruling.verdict;
        if (verdict === "pass") { tick(["G4 · ", bold(step.ruling.said)]); break; }
        if (verdict === "abstain") { tick([`G4 · ${step.ruling.said}`], "warn"); break; }
        verdictCard({
          applies: false,
          netLines: 0,
          rulings: [step.ruling],
        });
        break;
      }
      case "repairing":
        tick([bold(step.gate), ` lo detuvo · rehaciendo (intento ${step.attempt})`], "warn");
        break;
      case "dieted":
        tick(["segunda pasada · ", bold(`${signed(step.from)} → ${signed(step.to)}`), " líneas"]);
        break;
      case "dietRejected":
        tick([step.reason], "warn");
        break;
      case "applied":
        saved += step.net;
        savedLabel.textContent = `${signed(saved)} líneas en esta sesión`;
        if (step.files.length > 1) {
          tick([bold(`${step.files.length} ficheros`), ` · ${signed(step.net)} líneas netas`]);
        }
        for (const file of step.files) diffCard(file);
        remember(step.files);
        break;
      case "reindexed":
        tick(step.millis === 0
          ? ["índice al día · ", bold("ya lo estaba")]
          : ["índice al día · ", bold(`${step.millis} ms`), step.delegated ? " · vía Node" : " · nativo"]);
        break;
      case "reindexFailed":
        tick([step.reason], "warn");
        break;
      case "gaveUp":
        turn("Motor · me planto", step.reason);
        break;
    }
  }

  const when = (millis) => new Date(millis).toLocaleString("es", {
    day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit",
  });

  async function paintSessions() {
    const listed = await invoke("sessions", { root });
    sessionList.replaceChildren();
    if (!listed.length) {
      sessionList.append(el("p", "none", "Todavía no hay sesiones."));
      return;
    }
    for (const summary of listed) {
      const card = el("button", "session");
      card.setAttribute("aria-current", String(summary.id === current));
      const meta = el("div", "meta");
      meta.append(el("span", null, when(summary.startedAt)));
      if (summary.stops) meta.append(el("span", "hit", `${summary.stops} paradas`));
      if (summary.netLines) meta.append(el("span", "cut", `${signed(summary.netLines)}`));
      card.append(el("div", "name", summary.title), meta);
      card.addEventListener("click", () => load(summary.id));
      sessionList.append(card);
    }
  }

  function paintFiles() {
    const needle = filterInput.value.trim().toLowerCase();
    const shown = needle ? files.filter((f) => f.path.toLowerCase().includes(needle)) : files;
    fileList.replaceChildren();

    if (!shown.length) {
      fileList.append(el("p", "none", root ? "Nada coincide." : "Sin proyecto."));
      return;
    }
    for (const file of shown.slice(0, 400)) {
      const row = el("button", "filerow");
      row.append(el("span", "path", file.path), el("span", "n", String(file.symbols)));
      row.title = file.path;
      if (file.path === opened) row.setAttribute("aria-current", "true");
      if (touched.has(file.path)) row.dataset.touched = "true";
      row.addEventListener("click", () => view(file.path));
      fileList.append(row);
    }
  }

  const KEYWORDS = new Set(["abstract","as","async","await","break","case","catch","class","const","continue","crate","def","default","delete","do","elif","else","enum","export","extends","extern","false","fn","for","from","func","function","go","if","impl","implements","import","in","instanceof","interface","lambda","let","loop","match","mod","mut","new","nil","null","of","package","pass","pub","raise","return","self","static","struct","super","switch","this","throw","trait","true","try","type","typeof","undefined","use","var","void","where","while","with","yield"]);

  const TOKENS = /("(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'|`(?:\\.|[^`\\])*`)|(\/\/.*$)|(\b\d[\w.]*\b)|([A-Za-z_$][\w$]*)(?=\s*\()|([A-Za-z_$][\w$]*)/gm;

  function painted(text, hash) {
    const out = document.createDocumentFragment();
    if (hash && /^\s*#/.test(text)) {
      out.append(el("span", "tok-com", text));
      return out;
    }
    let last = 0;
    for (const found of text.matchAll(TOKENS)) {
      const [all, str, com, num, call] = found;
      if (found.index > last) out.append(document.createTextNode(text.slice(last, found.index)));
      if (str) out.append(el("span", "tok-str", all));
      else if (com) out.append(el("span", "tok-com", all));
      else if (num) out.append(el("span", "tok-num", all));
      else if (KEYWORDS.has(all)) out.append(el("span", "tok-key", all));
      else if (call) out.append(el("span", "tok-fn", all));
      else out.append(document.createTextNode(all));
      last = found.index + all.length;
    }
    if (last < text.length) out.append(document.createTextNode(text.slice(last)));
    return out;
  }

  async function view(path) {
    let text;
    try {
      text = await invoke("open_file", { root, path });
    } catch (reason) {
      text = String(reason);
    }

    opened = path;
    where.textContent = path;
    where.title = path;

    const change = touched.get(path);
    marks.replaceChildren();
    if (change) {
      marks.append(el("span", "plus", `+${change.plus}`), el("span", "minus", `−${change.minus}`));
    }

    const hash = /\.(py|rb|sh|toml|ya?ml)$/i.test(path);
    const drawn = document.createDocumentFragment();
    text.split("\n").forEach((line, i) => {
      const row = el("div", "line");
      if (change && change.add.has(i + 1)) row.dataset.touched = "add";
      const src = el("span", "src");
      src.append(painted(line, hash));
      row.append(el("span", "num", String(i + 1)), src);
      drawn.append(row);
    });

    sourcePane.replaceChildren(drawn);
    sourcePane.scrollTop = 0;
    sourcePane.querySelector('[data-touched="add"]')?.scrollIntoView({ block: "center" });
    paintFiles();
  }

  function remember(changed) {
    for (const file of changed) {
      touched.set(file.path, {
        add: new Set(file.added.map((line) => line.line)),
        plus: file.added.length,
        minus: file.removed.length,
      });
    }
    if (!changed.length) return;
    body.dataset.code = "open";
    view(changed[0].path);
  }

  async function loadFiles() {
    files = await invoke("tree", { root });
    paintFiles();
  }

  async function load(id) {
    current = id;
    saved = 0;
    savedLabel.textContent = "";
    inner.replaceChildren();

    for (const entry of await invoke("replay", { root, id })) {
      if (entry.kind === "task") turn("Tú", entry.text, true);
      else if (entry.kind === "beat") renderStep(entry.step);
      else if (entry.kind === "failed") turn("Motor", entry.reason);
    }
    if (!inner.childElementCount) {
      turn("Motor", "Sesión nueva. El modelo propone, yo decido. Dime qué hacer.");
    }
    await paintSessions();
  }

  async function refresh() {
    if (!root) return;
    const status = await invoke("status", { root });
    sealLabel.textContent = status.seal;
    if (!status.indexed) {
      health.dataset.fresh = "none";
      indexState.textContent = "sin índice";
      return;
    }
    health.dataset.fresh = String(status.fresh);
    indexState.textContent = status.fresh
      ? `${status.symbols} símbolos · ${status.files} ficheros`
      : `índice obsoleto · ${status.symbols} símbolos`;
  }

  function idle(on) {
    busy = !on;
    taskInput.disabled = !on || !root || !current;
  }

  async function freshSession() {
    current = await invoke("open_session", { root });
    await load(current);
    idle(true);
    taskInput.focus();
  }

  function provider() {
    return providerSelect.value === "otro" ? commandInput.value.trim() : providerSelect.value;
  }

  function syncProvider() {
    commandInput.hidden = providerSelect.value !== "otro";
    keyInput.disabled = providerSelect.value !== "api";
    crewLabel.textContent =
      providerSelect.value === "api"
        ? "sonnet 5 · haiku 4.5"
        : providerSelect.value === "claude"
          ? "claude code · sin herramientas de disco"
          : provider() || "sin comando";
  }

  document.getElementById("open").addEventListener("click", async () => {
    const picked = await dialog.open({ directory: true, title: "Elige el proyecto" });
    if (!picked) return;
    root = picked;
    rootLabel.textContent = picked;
    touched.clear();
    opened = "";
    where.textContent = "Ningún fichero abierto";
    marks.replaceChildren();
    sourcePane.replaceChildren(el("p", "empty", "Elige un fichero."));
    await refresh();
    await loadFiles();
    await freshSession();
  });

  document.getElementById("new-session").addEventListener("click", () => {
    if (root && !busy) freshSession();
  });

  document.getElementById("toggle-files").addEventListener("click", () => {
    body.dataset.code = body.dataset.code === "open" ? "closed" : "open";
  });
  document.getElementById("close-code").addEventListener("click", () => {
    body.dataset.code = "closed";
  });
  document.getElementById("toggle-tree").addEventListener("click", (event) => {
    const shown = codeBody.dataset.tree !== "hidden";
    codeBody.dataset.tree = shown ? "hidden" : "shown";
    event.currentTarget.setAttribute("aria-pressed", String(!shown));
  });

  filterInput.addEventListener("input", paintFiles);
  providerSelect.addEventListener("change", syncProvider);
  commandInput.addEventListener("input", syncProvider);

  taskInput.addEventListener("keydown", async (event) => {
    if (event.key !== "Enter" || busy || !taskInput.value.trim()) return;
    const task = taskInput.value.trim();
    taskInput.value = "";
    turn("Tú", task, true);
    idle(false);

    try {
      await invoke("work", { root, task, key: keyInput.value, provider: provider(), sessionId: current });
    } catch (reason) {
      turn("Motor", String(reason));
      idle(true);
    }
  });

  listen("step", ({ payload }) => renderStep(payload));

  listen("done", async () => {
    idle(true);
    await refresh();
    await loadFiles();
    await paintSessions();
  });

  listen("failed", async ({ payload }) => {
    turn("Motor", String(payload));
    idle(true);
    await paintSessions();
  });

  turn("Motor", "Abre un proyecto para empezar.");
  syncProvider();
</script>
</body>
</html>
