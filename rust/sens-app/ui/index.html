<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sens</title>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn rail-toggle" id="toggle-rail" aria-controls="rail" aria-expanded="true" aria-keyshortcuts="Control+B"></button>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <defs><clipPath id="sens-brand-body"><rect width="48" height="48" rx="11"/></clipPath></defs>
        <g clip-path="url(#sens-brand-body)">
          <rect width="48" height="48" fill="var(--sens-carbon-800)"/>
          <path d="M48 13C41 13 35 8.5 29 8.5C21 8.5 13.5 13 13.5 18.5C13.5 23 19 21.8 24 24C29 26.2 34.5 25 34.5 29.5C34.5 35 27 39.5 19 39.5C13 39.5 7 35 0 35" fill="none" stroke="var(--sens-signal-500)" stroke-width="4.6" stroke-linecap="round"/>
        </g>
      </svg>
      <b>sens</b>
    </div>

    <button class="update-pill" id="update" hidden></button>
    <div class="win" id="win" data-max="false">
      <button class="tools-btn" id="tools" title="Herramientas" aria-label="Herramientas" aria-haspopup="menu" aria-expanded="false" data-running="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      <button id="win-min" title="Minimizar" aria-label="Minimizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="win-max" title="Maximizar" aria-label="Maximizar">
        <span class="grow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span>
        <span class="restore"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="12" height="12" rx="2"/><path d="M15 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h4"/></svg></span>
      </button>
      <button class="shut" id="win-close" title="Cerrar" aria-label="Cerrar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </header>

  <div class="body" id="body" data-code="closed">
    <nav class="rail" id="rail">
      <div class="rail-nav">
        <button class="nav-row" id="new-session" aria-keyshortcuts="Control+N">
          <span class="nav-icon"></span>
          <span class="nav-label">Sesión nueva</span>
          <span class="hint-keys" aria-hidden="true"><kbd>Ctrl</kbd><kbd>N</kbd></span>
        </button>
        <button class="nav-row" id="capabilities" aria-current="false">
          <span class="nav-icon"></span>
          <span class="nav-label">Capacidades</span>
        </button>
        <button class="nav-row" id="artifacts" aria-current="false">
          <span class="nav-icon"></span>
          <span class="nav-label">Artefactos</span>
        </button>
      </div>
      <div class="sessions" id="sessions"></div>
      <div class="rail-foot" id="rail-foot">
        <div class="sheet menu" id="menu" role="menu" aria-label="Perfil" hidden>
          <button class="menu-item" role="menuitem" tabindex="-1" data-panel="settings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Ajustes</span>
          </button>
          <button class="menu-item" role="menuitem" tabindex="-1" data-panel="keys">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 8h.01"/><path d="M12 12h.01"/><path d="M14 8h.01"/><path d="M16 12h.01"/><path d="M18 8h.01"/><path d="M6 8h.01"/><path d="M7 16h10"/><path d="M8 12h.01"/><rect width="20" height="16" x="2" y="4" rx="2"/></svg>
            <span>Atajos de teclado</span>
          </button>
          <button class="menu-item" role="menuitem" tabindex="-1" data-panel="about">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <span>Acerca de Sens</span>
          </button>
        </div>
        <button class="me" id="profile" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar" id="avatar" aria-hidden="true"></span>
          <span class="me-name" id="profile-name" data-empty="true">Sin nombre</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
        </button>
      </div>
    </nav>
    <div class="split" id="rail-split" role="separator" aria-orientation="vertical" aria-label="Ancho de la barra lateral" tabindex="0"></div>

    <section class="chat">
      <div class="stream" id="stream">
        <div class="thread" id="thread">
          <div class="thread-inner" id="thread-inner"></div>
        </div>
        <div class="fade top" aria-hidden="true"></div>
        <div class="fade bottom" aria-hidden="true"></div>
      </div>
      <div class="composer">
        <div class="composer-inner">
          <div class="workspace">
            <button class="chipbtn" id="folder" title="Elegir carpeta de trabajo">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
              </svg>
              <span id="root">Elegir carpeta…</span>
            </button>
            <button class="chipbtn" id="branch" aria-haspopup="true" aria-expanded="false" hidden>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M6 3v12"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/>
              </svg>
              <span id="branch-name">—</span>
              <span class="dirty" id="dirty" hidden></span>
            </button>
            <div class="sheet" id="branches" hidden>
              <div id="branch-here"></div>
              <div class="seek">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
                </svg>
                <input class="field" id="branch-filter" placeholder="Buscar ramas…" autocomplete="off" spellcheck="false">
              </div>
              <div class="rows" id="branch-rows"></div>
            </div>
          </div>
          <div class="clips" id="clips" hidden></div>
          <div class="box">
            <button class="round" id="attach" title="Adjuntar ficheros" aria-label="Adjuntar ficheros"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11.5 12.2 19.3a4.5 4.5 0 0 1-6.4-6.4l7.8-7.8a3 3 0 0 1 4.3 4.3l-7.8 7.8a1.5 1.5 0 0 1-2.2-2.1l7.2-7.2"/></svg></button>
            <button class="round" id="dictate" title="Dictar" aria-label="Dictar" aria-pressed="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
            <textarea id="task" rows="1" placeholder="Pide lo que necesites…" aria-label="Mensaje para Claude" autocomplete="off" disabled></textarea>
            <button class="round send" id="send" title="Enviar" aria-label="Enviar" disabled>
              <span class="go"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></span><span class="halt"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg></span>
            </button>
          </div>
          <div class="under">
            <div class="knobs">
              <div class="pick-anchor">
                <button class="picker-btn" id="pick" aria-haspopup="true" aria-expanded="false">
                  <span id="crew">modelo</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="sheet menu models knob-sheet" id="picker" role="menu" aria-label="Modelos" hidden>
                  <div id="model-rows"></div>
                  <div class="model-quiet" id="model-account" hidden></div>
                  <div class="model-quiet warn" id="model-note" hidden></div>
                  <div class="model-rule"></div>
                  <button class="menu-item tool" role="menuitem" tabindex="-1" id="models-connect" hidden></button>
                  <button class="menu-item tool" role="menuitem" tabindex="-1" id="models-refresh"></button>
                  <button class="menu-item tool" role="menuitem" tabindex="-1" id="models-edit"></button>
                </div>
              </div>
              <div class="pick-anchor">
                <button class="picker-btn" id="mode-pick" aria-haspopup="true" aria-expanded="false" title="Permisos">
                  <span id="mode-label">Preguntar</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
                </button>
                <div class="sheet menu models knob-sheet" id="mode-sheet" role="menu" aria-label="Permisos" hidden></div>
              </div>
            </div>
            <div class="knobs-right">
              <button class="toggle" id="think" aria-pressed="true" aria-label="Razonamiento">
                <span class="toggle-icon" aria-hidden="true"></span>
                <span class="toggle-track" aria-hidden="true"><span class="toggle-knob"></span></span>
              </button>
              <div class="pick-anchor effort" id="effort" hidden>
              <button class="picker-btn" id="effort-pick" aria-haspopup="true" aria-expanded="false" title="Esfuerzo">
                <span id="effort-label">esfuerzo</span><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
              </button>
              <div class="sheet effort-sheet" id="effort-sheet" aria-label="Esfuerzo" hidden>
                <div class="effort-head">
                  <span class="effort-name">Esfuerzo <b id="effort-now"></b></span>
                  <span class="effort-help" id="effort-help" tabindex="0" role="note"></span>
                </div>
                <div class="effort-ends"><span>Más rápido</span><span>Más inteligente</span></div>
                <div class="effort-track" id="effort-track" role="slider" tabindex="0" aria-label="Esfuerzo" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                  <canvas class="effort-fill" id="effort-pixels" aria-hidden="true"></canvas>
                  <div class="effort-ticks" id="effort-ticks" aria-hidden="true"></div>
                  <div class="effort-knob" aria-hidden="true"></div>
                </div>
              </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="shelf" aria-label="Artefactos" hidden>
      <div class="view-inner" id="shelf-body"></div>
    </section>

    <section class="view" id="capabilities-view" aria-label="Capacidades" hidden>
      <div class="view-inner" id="capabilities-body"></div>
    </section>

    <section class="view" id="settings-view" aria-label="Ajustes" hidden>
      <div class="view-inner">
        <header class="view-top">
          <div>
            <h1 class="label">Ajustes</h1>
            <p>Tu perfil y los proveedores con los que trabaja Sens.</p>
          </div>
        </header>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </section>

    <div class="split" id="panel-split" role="separator" aria-orientation="vertical" aria-label="Ancho del panel de herramientas" tabindex="0"></div>
    <aside class="code" id="code" data-tool="files">
      <section class="tool" data-tool="files" aria-label="Ficheros">
        <div class="code-head">
          <span class="where" id="where">Ningún fichero abierto</span>
          <span class="marks" id="marks"></span>
          <div class="code-tools">
            <div class="segment" id="code-modes" hidden>
              <button id="mode-source" aria-pressed="true">Código</button>
              <button id="mode-view" aria-pressed="false">Vista</button>
            </div>
            <button class="icon-btn" id="toggle-tree" title="Árbol de ficheros" aria-pressed="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h6M4 12h16M4 18h10"/>
              </svg>
            </button>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="code-body" id="code-body" data-tree="shown">
          <div class="tree" id="tree"></div>
          <div class="split" id="tree-split" role="separator" aria-orientation="vertical" aria-label="Ancho del árbol de ficheros" tabindex="0"></div>
          <div class="source" id="source"><p class="empty">Elige un fichero.</p></div>
          <div class="reading" id="reading" hidden></div>
        </div>
      </section>

      <section class="tool" data-tool="changes" aria-label="Cambios" hidden>
        <div class="code-head">
          <span class="tool-name">Cambios</span>
          <span class="marks" id="change-marks"></span>
          <div class="code-tools">
            <button class="icon-btn" id="changes-reload" title="Actualizar" aria-label="Actualizar"></button>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="tool-body" id="changes" aria-live="polite"></div>
      </section>

      <section class="tool" data-tool="web" aria-label="Web" hidden>
        <div class="code-head">
          <form class="seek address" id="site-address" role="search">
            <input class="field" id="site-url" placeholder="Busca o escribe una dirección" aria-label="Dirección o página del proyecto" autocomplete="off" spellcheck="false">
          </form>
          <div class="code-tools">
            <button class="icon-btn" id="site-out" title="Abrir en el navegador" aria-label="Abrir en el navegador" hidden></button>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="site" id="site">
          <div class="site-bar">
            <button class="icon-btn" id="site-back" title="Atrás" aria-label="Atrás"></button>
            <button class="icon-btn" id="site-forward" title="Adelante" aria-label="Adelante"></button>
            <button class="icon-btn" id="site-reload" title="Recargar" aria-label="Recargar"></button>
            <div class="segment" id="site-widths" role="group" aria-label="Ancho">
              <button data-width="0" aria-pressed="true">Auto</button>
              <button data-width="390" aria-pressed="false">390</button>
              <button data-width="768" aria-pressed="false">768</button>
              <button data-width="1280" aria-pressed="false">1280</button>
            </div>
            <button class="icon-btn" id="site-console" title="Consola" aria-label="Consola" aria-pressed="false"></button>
          </div>
          <div class="site-frame" id="site-frame">
            <p class="site-empty" id="site-empty">Busca en la web o escribe una dirección: una web, tu servidor local (localhost:5173) o una página del proyecto (index.html).</p>
          </div>
          <div class="site-log" id="site-log" hidden></div>
        </div>
      </section>

      <section class="tool" data-tool="tasks" aria-label="Segundo plano" hidden>
        <div class="code-head">
          <span class="tool-name">Segundo plano</span>
          <span class="tool-tally" id="task-tally"></span>
          <div class="code-tools">
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="tool-body" id="tasks"></div>
      </section>
    </aside>
  </div>
</div>

<div class="sheet menu float-menu tool-menu" id="tool-menu" role="menu" aria-label="Herramientas" hidden></div>

<div class="sheet menu float-menu" id="session-menu" role="menu" aria-label="Gestionar sesión" hidden>
  <button class="menu-item" role="menuitem" tabindex="-1" data-act="rename"><span class="act-icon"></span><span class="act-text">Renombrar</span></button>
  <button class="menu-item" role="menuitem" tabindex="-1" data-act="archive"><span class="act-icon"></span><span class="act-text"></span></button>
  <button class="menu-item risky" role="menuitem" tabindex="-1" data-act="erase"><span class="act-icon"></span><span class="act-text"></span></button>
</div>

<dialog class="panel" id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button class="icon-btn" id="panel-close" title="Cerrar" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
