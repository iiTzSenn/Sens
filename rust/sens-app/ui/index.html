<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Sens</title>
</head>
<body>

<div class="app">
  <header class="topbar">
    <button class="icon-btn rail-toggle" id="toggle-rail" aria-controls="rail" aria-expanded="true" aria-keyshortcuts="Control+B"></button>
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <defs><clipPath id="sens-brand-body"><rect width="48" height="48" rx="11"/></clipPath></defs>
        <g clip-path="url(#sens-brand-body)">
          <rect width="48" height="48" fill="var(--sens-carbon-800)"/>
          <path d="M48 13C41 13 35 8.5 29 8.5C21 8.5 13.5 13 13.5 18.5C13.5 23 19 21.8 24 24C29 26.2 34.5 25 34.5 29.5C34.5 35 27 39.5 19 39.5C13 39.5 7 35 0 35" fill="none" stroke="var(--sens-signal-500)" stroke-width="4.6" stroke-linecap="round"/>
        </g>
      </svg>
      <b>sens</b>
    </div>

    <button class="update-pill" id="update" hidden></button>
    <div class="win" id="win" data-max="false">
      <button class="tools-btn" id="tools" title="Herramientas" aria-label="Herramientas" aria-haspopup="menu" aria-expanded="false" data-running="false"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg></button>
      <button id="win-min" title="Minimizar" aria-label="Minimizar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      <button id="win-max" title="Maximizar" aria-label="Maximizar">
        <span class="grow"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></span>
        <span class="restore"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="12" height="12" rx="2"/><path d="M15 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h4"/></svg></span>
      </button>
      <button class="shut" id="win-close" title="Cerrar" aria-label="Cerrar"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
  </header>

  <div class="body" id="body" data-code="closed">
    <nav class="rail" id="rail"></nav>
    <div class="split" id="rail-split" role="separator" aria-orientation="vertical" aria-label="Ancho de la barra lateral" tabindex="0"></div>

    <section class="chat">
      <div class="hosted" id="chat-thread"></div>
      <div class="hosted" id="composer"></div>
    </section>

    <section class="view" id="shelf" aria-label="Artefactos" hidden>
      <div class="view-inner" id="shelf-body"></div>
    </section>

    <section class="view" id="capabilities-view" aria-label="Capacidades" hidden>
      <div class="view-inner" id="capabilities-body"></div>
    </section>

    <section class="view" id="settings-view" aria-label="Ajustes" hidden>
      <div class="view-inner">
        <header class="view-top">
          <div>
            <h1 class="label">Ajustes</h1>
            <p>Tu perfil y los proveedores con los que trabaja Sens.</p>
          </div>
        </header>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </section>

    <div class="split" id="panel-split" role="separator" aria-orientation="vertical" aria-label="Ancho del panel de herramientas" tabindex="0"></div>
    <aside class="code" id="code" data-tool="files">
      <section class="tool" data-tool="files" aria-label="Ficheros">
        <div class="code-head">
          <div class="hosted" id="viewer-head"></div>
          <div class="code-tools">
            <div class="hosted" id="viewer-modes"></div>
            <button class="icon-btn" id="toggle-tree" title="Árbol de ficheros" aria-pressed="true">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 6h6M4 12h16M4 18h10"/>
              </svg>
            </button>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="code-body" id="code-body" data-tree="shown">
          <div class="tree" id="tree"></div>
          <div class="split" id="tree-split" role="separator" aria-orientation="vertical" aria-label="Ancho del árbol de ficheros" tabindex="0"></div>
          <div class="hosted" id="viewer"></div>
        </div>
      </section>

      <section class="tool" data-tool="changes" aria-label="Cambios" hidden>
        <div class="code-head">
          <span class="tool-name">Cambios</span>
          <span class="marks" id="change-marks"></span>
          <div class="code-tools">
            <button class="icon-btn" id="changes-reload" title="Actualizar" aria-label="Actualizar"></button>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="tool-body" id="changes" aria-live="polite"></div>
      </section>

      <section class="tool" data-tool="web" aria-label="Web" hidden>
        <div class="code-head">
          <div class="hosted" id="web-address"></div>
          <div class="code-tools">
            <div class="hosted" id="web-out"></div>
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="site" id="site"></div>
      </section>

      <section class="tool" data-tool="tasks" aria-label="Segundo plano" hidden>
        <div class="code-head">
          <span class="tool-name">Segundo plano</span>
          <span class="tool-tally" id="task-tally"></span>
          <div class="code-tools">
            <button class="icon-btn shut-tool" title="Cerrar" aria-label="Cerrar"></button>
          </div>
        </div>
        <div class="tool-body" id="tasks"></div>
      </section>
    </aside>
  </div>
</div>

<div class="sheet menu float-menu tool-menu" id="tool-menu" role="menu" aria-label="Herramientas" hidden></div>

<dialog class="panel" id="panel" aria-labelledby="panel-title">
  <div class="panel-head">
    <h2 id="panel-title"></h2>
    <button class="icon-btn" id="panel-close" title="Cerrar" aria-label="Cerrar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
    </button>
  </div>
  <div class="panel-body" id="panel-body"></div>
</dialog>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
