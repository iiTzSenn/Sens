[package]
name = "sens-hook"
version = "0.1.0"
edition = "2024"

[dependencies]
ignore = "0.4.33"
indexmap = { version = "2.14.2", features = ["serde"] }
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order", "raw_value"] }
